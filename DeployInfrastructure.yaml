AWSTemplateFormatVersion: '2010-09-09'
Description: Spring AI Agent deployed to Amazon Bedrock AgentCore Runtime

Parameters:

  ImageUri:
    Type: String
    Description: ECR image URI containing the Spring Boot agent

Resources:

  AgentRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess

  AgentRuntime:

    Type: AWS::BedrockAgentCore::Runtime

    Properties:

      AgentRuntimeName: springaiagent

      RoleArn: !GetAtt AgentRuntimeRole.Arn

      EnvironmentVariables:
        MCP_DISABLE: false
        
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ImageUri
Outputs:

  RuntimeArn:
    Description: Runtime ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn

  RuntimeId:
    Description: Runtime identifier
    Value: !Ref AgentRuntime